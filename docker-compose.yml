services:

  # Container 1
  chromadb:
    image: chromadb/chroma:latest       # Official, pre-packaged ChromaDB image
    container_name: chromadb
    ports:
      - "8000:8000"
    volumes:
      - ./data/chromadb:/data           # Bind mount: maps pre-indexed local DB to container
    environment:
      - IS_PERSISTENT=TRUE              # Embeddings will be stored on disk, not RAM
      - PERSIST_DIRECTORY=/data         # Points Chroma to the mounted database folder
      - ANONYMIZED_TELEMETRY=FALSE
      
    restart: unless-stopped              # Restarts chroma if crashes or unexpected exits, except manual stops

  # Container 2
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ask-node-app
    depends_on:
      - chromadb                        # Ensures starting DB before running Node app
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    env_file:
      - .env
    volumes:                            # Bind mounts
      - ./docs:/app/docs                # Syncs ./docs dir with container's /app/docs (for any data changes)
      - ./logs:/app/logs                # Mounts logs directory so debug.txt persists on host machine
